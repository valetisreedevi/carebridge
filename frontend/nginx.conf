server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: /elder must serve the app, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

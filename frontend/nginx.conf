server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;

    # Hashed filenames, so these can be cached hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the current
    # bundle, so a cached copy pins visitors to an old build after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: /elder must serve the app, not 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

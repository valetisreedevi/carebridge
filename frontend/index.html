<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareBridge</title>

    <!-- start_url is /elder on purpose: the phone anybody installs this on is
         the one sitting on a side table, not the caregiver's, who uses a
         browser. Installed it runs standalone, with no address bar for
         somebody to lose the page behind. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f6b5c" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- The submission gets shared as a bare link. Without these it unfurls as
         a naked URL, which reads as unfinished whatever the product does. -->
    <meta name="description" content="Medicine reminders in your family's own voice. CareBridge reminds an elder to take her medicines and tells the family honestly what happened." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CareBridge" />
    <meta property="og:description" content="Medicine reminders in your family's own voice." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Newsreader carries the human half, Figtree the operational half, and
         Noto Sans Telugu is not optional: without it a Telugu screen falls
         back to whatever the handset happens to have, which on a cheap phone
         is often nothing at all. Preconnected because the elder screen is
         read by someone waiting to take a tablet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Sans+Telugu:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
